name: metamaps_flutter
description: Embed maps built with Metamaps in Flutter apps, with optional indoor positioning.
version: 0.6.0
publish_to: none
homepage: https://metamaps.jp
repository: https://github.com/boldright/Metamaps-SDK/tree/main/flutter/metamaps_flutter
issue_tracker: https://github.com/boldright/Metamaps-SDK/issues
topics:
  - maps
  - indoor-maps
  - indoor-positioning

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.9'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: 27.3.0

flutter:
  plugin:
    platforms:
      android:
        package: jp.metamaps.flutter
        pluginClass: MetamapsPlugin
      ios:
        pluginClass: MetamapsPlugin
